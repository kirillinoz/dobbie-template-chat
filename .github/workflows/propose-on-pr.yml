name: 1. Validate, Build, and Propose On-Chain

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches:
      - 'main'
permissions: {}

jobs:
  create-package:
    name: 1. Validate & Create Package
    if: |
      github.event.pull_request.draft == false && 
      !contains(github.event.pull_request.labels.*.name, 'stop-checks')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      manifest_cid: ${{ steps.upload.outputs.cid }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Ensure Branch is Up-To-Date
        run: |
          git fetch origin main
          BEHIND_COUNT=$(git rev-list HEAD..origin/main --count)
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "❌ Branch is behind main by $BEHIND_COUNT commits. Please rebase before proposing."
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: 'Setup Node.js 22 (LTS)'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache Solidity Compilers
        uses: actions/cache@v4
        id: cache-solc
        with:
          path: ~/.hardhat/compilers
          key: ${{ runner.os }}-solc-${{ hashFiles('hardhat.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-solc-
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Linter
        run: pnpm lint
      - name: Run Tests
        run: pnpm hardhat test
      - name: Run DevOps Package Script
        run: pnpm hardhat run scripts/devops/package.ts
      - name: Zip the Package
        run: |
          cd proposal-package
          zip -r ../proposal-package.zip .
          cd ..
      - name: Run DevOps Upload Script
        id: upload
        run: |
          pnpm hardhat run scripts/devops/upload.ts
          echo "cid=$(cat outputs/cid.txt)" >> $GITHUB_OUTPUT
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}

  propose-on-chain:
    name: 2. Propose On-Chain
    runs-on: ubuntu-latest
    needs: [create-package]
    permissions:
      contents: read
    outputs:
      proposal_id: ${{ steps.propose.outputs.proposal_id }}
      proposal_block: ${{ steps.propose.outputs.proposal_block }}

    env:
      RPC_URL: ${{ secrets.RPC_URL }}
      GOVERNOR_ADDRESS: ${{ secrets.GOVERNOR_ADDRESS }}
      DEPLOYMENT_REGISTRY_ADDRESS: ${{ secrets.DEPLOYMENT_REGISTRY_ADDRESS }}
      PROPOSER_KEY: ${{ secrets.PROPOSER_KEY }}
      WALLET_KEY: ${{ secrets.PROPOSER_KEY }} # For hardhat config

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: 'Setup Node.js 22 (LTS)'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 'Calculate Target Address'
        id: calc
        run: pnpm hardhat run ./scripts/devops/calculate-address.ts --network sepolia
        env:
          PACKAGE_CID: ${{ needs.create-package.outputs.manifest_cid }}
          DEPLOYMENT_REGISTRY_ADDRESS: ${{ secrets.DEPLOYMENT_REGISTRY_ADDRESS }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}

      - name: 'Run Propose Script'
        id: propose
        run: pnpm hardhat run ./scripts/devops/propose.ts --network sepolia
        env:
          PACKAGE_CID: ${{ needs.create-package.outputs.manifest_cid }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TARGET_ADDRESS: ${{ steps.calc.outputs.target_address }}
          SALT: ${{ steps.calc.outputs.salt }}

      - name: Upload Proposal ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'proposal-id-${{ github.event.pull_request.number }}'
          path: ./proposal-id.json
          retention-days: 7

  comment-on-pr:
    name: 3. Comment on PR
    runs-on: ubuntu-latest
    needs: [create-package, propose-on-chain]
    permissions:
      pull-requests: write
    steps:
      - name: Post Proposal Success to PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ### 🤖 Proposal Submitted On-Chain
            *(For commit ${{ github.event.pull_request.head.sha }})*

            This version of the PR has been built and automatically proposed on-chain.

            - 🆔 **Proposal ID:** `${{ needs.propose-on-chain.outputs.proposal_id }}`
            - 📦 **Manifest CID:** `${{ needs.create-package.outputs.manifest_cid }}`
            - 🗳️ **Vote 1 State** | █▒▒▒ | ⌛ Pending

            A bot is now monitoring the blockchain for the vote. Stakeholders must now vote using the Dashboard UI to accept or reject the package proposal.

            <details>
            <summary>🤖 Bot Debug Information</summary>

            PROPOSAL-ID: ${{ needs.propose-on-chain.outputs.proposal_id }}
            HEAD-SHA: ${{ github.event.pull_request.head.sha }}
            PROPOSAL-BLOCK: ${{ needs.propose-on-chain.outputs.proposal_block }}
            MANIFEST-CID: ${{ needs.create-package.outputs.manifest_cid }}

            </details>
          comment-tag: on-chain-proposal-${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
