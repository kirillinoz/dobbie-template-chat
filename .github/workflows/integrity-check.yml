name: 3. System Integrity Check

on:
  push:
    branches:
      - 'main'
  workflow_dispatch: {}

jobs:
  verify-bytecode:
    name: 'Verify Main vs On-Chain'
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ secrets.RPC_URL }}
      DEPLOYMENT_REGISTRY_ADDRESS: ${{ secrets.DEPLOYMENT_REGISTRY_ADDRESS }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      WALLET_KEY: ${{ secrets.PROPOSER_KEY }}

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v4

      - name: 'Setup Node.js 22 (LTS)'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 'Install Dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Compile Contracts'
        run: pnpm hardhat compile

      - name: 'Run Verification Script'
        run: pnpm hardhat run ./scripts/devops/verify-integrity.ts --network sepolia
